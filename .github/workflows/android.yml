name: Android APK

# Builds the Capacitor shell around the same web bundle and publishes a
# downloadable debug APK. The local machine has no JDK or Android SDK, so the
# runner supplies both — which is the whole reason this workflow exists.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/android/**'
      - 'frontend/capacitor.config.ts'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Capacitor 8 targets a modern AGP, which needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Build the web bundle
        working-directory: frontend
        run: pnpm build

      - name: Copy the bundle into the native project
        working-directory: frontend
        run: pnpm exec cap sync android

      - name: Assemble the debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: force-wake-alarm-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifacts need a GitHub login to download; a release asset does not, so
      # the phone can just tap the link.
      - name: Publish a downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest \
            frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "强制清醒闹钟 · APK" \
            --notes "调试版 APK，用手机浏览器点开下面的 app-debug.apk 下载安装（需允许安装未知来源应用）。" \
            --latest
